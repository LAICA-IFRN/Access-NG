<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <title>Caronte — Cadastro pendente</title>
  <style>
    * { box-sizing:border-box; }
    body { background:#0d0d1a; color:#e0e0e0; display:flex; align-items:center;
           justify-content:center; min-height:100vh; font-size:16px; }
    .card { background:#1a1a2e; border:1px solid #2d2d4e; border-radius:12px;
            padding:2rem 1.5rem; width:100%; max-width:340px; margin:1rem; text-align:center; }
    .brand { color:#c9a227; font-weight:bold; letter-spacing:3px; font-size:1.6rem;
             margin-bottom:.25rem; }
    .icone { font-size:2.5rem; margin:1rem 0; }
    h6 { color:#e0e0e0; }
    p { color:#888; font-size:.9rem; }
    .btn-voltar { background:#0d0d1a; color:#e0e0e0; border:1px solid #2d2d4e; border-radius:8px;
                  width:100%; height:44px; font-size:.95rem; margin-top:1rem; }
    .btn-voltar:hover { border-color:#c9a227; color:#c9a227; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">&#9760; CARONTE</div>
  <div class="icone">&#8987;</div>
  <h6>Cadastro recebido, {{ nome }}</h6>
  <p>Seu login com o SUAP funcionou, mas seu acesso ainda depende da aprovação de um administrador do Access-NG. Volte a tentar mais tarde.</p>
  <a href="{{ url_for('caronte_login') }}" class="btn btn-voltar">Voltar</a>
</div>
</body>
</html>
